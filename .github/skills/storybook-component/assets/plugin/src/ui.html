<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ok: #1a7f37;
    --warn: #9a6700;
    --accent: var(--figma-color-text-brand, #0d99ff);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font: 12px/1.5 Inter, "Helvetica Neue", Arial, sans-serif;
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #000);
  }
  body { display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
  }
  .title { font-weight: 600; font-size: 13px; flex: 1; min-width: 0;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .version {
    font-size: 10px; padding: 2px 6px; border-radius: 10px;
    background: var(--figma-color-bg-secondary, #f0f0f0);
    color: var(--figma-color-text-secondary, #666); white-space: nowrap;
  }

  main { flex: 1; overflow-y: auto; padding: 12px 16px; }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 6px; text-align: center;
    color: var(--figma-color-text-secondary, #888);
  }
  .empty strong { color: var(--figma-color-text, #000); font-size: 13px; font-weight: 600; }

  .notice {
    display: flex; gap: 8px; padding: 8px 10px; border-radius: 6px;
    margin-bottom: 10px; font-size: 11px; line-height: 1.45;
    background: var(--figma-color-bg-warning-tertiary, #fff8e1);
    color: var(--figma-color-text-warning, #7a5900);
    border: 1px solid var(--figma-color-border-warning-strong, #f0d48a);
  }
  .block { margin-bottom: 14px; }
  .block-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .label {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--figma-color-text-secondary, #888); flex: 1;
  }

  pre {
    margin: 0; padding: 12px; border-radius: 6px; overflow-x: auto;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    border: 1px solid var(--figma-color-border, #e5e5e5);
    font: 11px/1.6 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    white-space: pre; tab-size: 2;
  }
  .tag  { color: #22863a; }
  .attr { color: #6f42c1; }
  .val  { color: #032f62; }
  .cmt  { color: #6a737d; font-style: italic; }
  @media (prefers-color-scheme: dark) {
    .tag { color: #7ee787; } .attr { color: #d2a8ff; }
    .val { color: #a5d6ff; } .cmt { color: #8b949e; }
  }

  button {
    font: inherit; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--figma-color-border, #d9d9d9);
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #000);
    padding: 5px 10px;
  }
  button:hover { background: var(--figma-color-bg-hover, #f0f0f0); }
  button.primary {
    background: var(--figma-color-bg-brand, #0d99ff); color: #fff; border-color: transparent;
  }
  footer {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; font-size: 10px;
    border-top: 1px solid var(--figma-color-border, #e5e5e5);
    color: var(--figma-color-text-secondary, #888);
  }
  footer .grow { flex: 1; min-width: 0; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
</style>
</head>
<body>
  <header>
    <div class="title" id="title">OUDS Code</div>
    <div class="version" id="componentVersion" hidden></div>
  </header>

  <main id="main">
    <div class="empty">
      <strong>Sélectionnez un composant</strong>
      <span>Le markup OUDS Web correspondant s'affichera ici.</span>
    </div>
  </main>

  <footer>
    <span class="dot"></span>
    <span class="grow" id="catalogue">…</span>
  </footer>

<script>
(function () {
  var main = document.getElementById('main');
  var title = document.getElementById('title');
  var cv = document.getElementById('componentVersion');
  var catalogue = document.getElementById('catalogue');

  function post(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /*
   * Coloration syntaxique en UN SEUL passage sur le code brut.
   *
   * Surtout ne pas enchaîner des .replace() sur du HTML déjà produit : le
   * troisième repérerait `class="tag"` dans le `<span class="tag">` posé par
   * le deuxième et le réécrirait. L'échappement est fait ici, au moment de
   * l'émission, jamais sur un texte déjà balisé.
   */
  function highlightAttrs(s) {
    var out = '', last = 0, m;
    var re = /([a-zA-Z_:][\w:.-]*)(?:(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+))?/g;
    while ((m = re.exec(s))) {
      if (m[0] === '') { re.lastIndex++; continue; }
      out += esc(s.slice(last, m.index));
      out += '<span class="attr">' + esc(m[1]) + '</span>';
      if (m[2]) out += esc(m[2]);
      if (m[3]) out += '<span class="val">' + esc(m[3]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + esc(s.slice(last));
  }

  function highlightTag(tag) {
    var m = /^(<\/?)([a-zA-Z][\w:-]*)([\s\S]*?)(\/?>)$/.exec(tag);
    if (!m) return esc(tag);
    return esc(m[1]) + '<span class="tag">' + esc(m[2]) + '</span>' +
           highlightAttrs(m[3]) + esc(m[4]);
  }

  function highlight(code) {
    var out = '', last = 0, m;
    var re = /<!--[\s\S]*?-->|<\/?[a-zA-Z][\w:-]*(?:"[^"]*"|'[^']*'|[^>])*>/g;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      out += m[0].slice(0, 4) === '<!--'
        ? '<span class="cmt">' + esc(m[0]) + '</span>'
        : highlightTag(m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(code.slice(last));
  }

  function el(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return d.firstElementChild;
  }

  function render(p) {
    catalogue.textContent = p.catalogue + ' · markup compilé dans le plugin';
    main.innerHTML = '';

    title.textContent = p.componentName || 'OUDS Code';
    if (p.version) {
      cv.hidden = false;
      cv.textContent = (p.codeName ? p.codeName + ' ' : '') + 'v' + p.version;
    } else { cv.hidden = true; }

    if (!p.code) {
      main.appendChild(el(
        '<div class="empty"><strong>' + esc(p.message || 'Sélectionnez un composant') +
        '</strong><span>Le markup OUDS Web s’affichera ici.</span></div>'
      ));
      return;
    }

    var block = el('<div class="block"></div>');
    var head = el('<div class="block-head"><span class="label">Markup OUDS Web</span></div>');
    var copy = el('<button class="primary">Copier</button>');
    head.appendChild(copy);
    block.appendChild(head);
    var pre = document.createElement('pre');
    pre.innerHTML = highlight(p.code);
    block.appendChild(pre);
    main.appendChild(block);

    copy.addEventListener('click', function () {
      var ta = document.createElement('textarea');
      ta.value = p.code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      copy.textContent = 'Copié ✓';
      post({ type: 'notify', message: 'Markup OUDS copié.' });
      setTimeout(function () { copy.textContent = 'Copier'; }, 1400);
    });
  }

  onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'payload') render(msg.payload);
  };

  post({ type: 'ready' });
})();
</script>
</body>
</html>
