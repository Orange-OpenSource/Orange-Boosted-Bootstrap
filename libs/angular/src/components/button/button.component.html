<button
    [ngClass]="buttonClasses"
    [type]="type"
    [attr.aria-label]="defaultAriaLabel"
    [disabled]="buttonDisabled"
    [attr.form]="formId"
    [attr.aria-describedby]="statusId"
    (click)="onClick()"
>
    <ng-content select="[icon]"></ng-content>

    @if (label && !isIconOnly && !isLoading) {
        {{ label }}
    }
    @if (isIconOnly && label) {
        <span class="visually-hidden">{{ label }}</span>
    }

    <ng-content></ng-content>
    @if (isLoading) {
        <svg
            viewBox="0 0 40 40"
            xmlns="http://www.w3.org/2000/svg"
            class="loader"
        >
            <circle class="loader-inner" cx="20" cy="20" r="17" />
        </svg>

        <span [id]="statusId" role="status">
            {{ loadingStatusText }}
        </span>
    }
</button>
