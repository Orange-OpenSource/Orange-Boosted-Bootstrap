# Netlify config for the @ouds/angular-storybook static site.
# Netlify site settings: package directory = apps/angular-storybook.
[build]
  # Install and build from the repository root (npm workspaces + Nx).
  base = "/"
  command = "npx nx run @ouds/core:build && npx nx run @ouds/angular:build && npm run storybook:angular:build && rm -rf public && mv dist/apps/angular-storybook public"
  publish = "public"
  # Skip the build when nothing this Storybook depends on changed (exit 0 = skip).
  # If CACHED_COMMIT_REF is empty (first deploy), git diff fails and the site is built.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/angular-storybook libs/angular libs/core libs/web/packages/orange package.json package-lock.json nx.json tsconfig.base.json"
