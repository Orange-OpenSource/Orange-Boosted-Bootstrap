# Netlify config for the @ouds/react-storybook static site.
# Netlify site settings: package directory = apps/react-storybook.
[build]
  # Install and build from the repository root (npm workspaces + Nx).
  base = "/"
  command = "npx nx run @ouds/core:build && npx nx run @ouds/react:build && npm run storybook:react:build && rm -rf public && mv dist/apps/react-storybook public"
  publish = "public"
  # Skip the build when nothing this Storybook depends on changed (exit 0 = skip).
  # If CACHED_COMMIT_REF is empty (first deploy), git diff fails and the site is built.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/react-storybook libs/react libs/core libs/web/packages/orange package.json package-lock.json nx.json tsconfig.base.json"
